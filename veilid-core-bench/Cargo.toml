[package]
name = "veilid-core-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shadow_node"
path = "src/bin/shadow_node/main.rs"

[features]
default = []

[dependencies]
veilid-core = { path = "../veilid-core", features = ["footgun"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.24.0"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["async_tokio"] }

[[bench]]
name = "crypto"
harness = false

[[bench]]
name = "table_store"
harness = false

[[bench]]
name = "protected_store"
harness = false

[[bench]]
name = "route"
harness = false
