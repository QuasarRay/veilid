name: Count Veilid source lines

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/loc-audit.yml"

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the mirrored source branch
        uses: actions/checkout@v4
        with:
          ref: mirror/main
          persist-credentials: false
      - name: Install cloc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cloc
      - name: Count code, comments and blanks by module
        shell: bash
        run: |
          cloc --json --by-file --skip-uniqueness --out=/tmp/veilid-loc.json .
          python3 - <<'PY'
          import collections
          import json
          import subprocess

          raw = json.load(open("/tmp/veilid-loc.json"))
          source_languages = {
              "Rust", "Dart", "Python", "TypeScript", "JavaScript", "C", "C++",
              "C/C++ Header", "C Header", "C++ Header", "Java", "Kotlin",
              "Swift", "Bourne Shell", "Bourne Again Shell", "PowerShell",
              "DOS Batch", "Batch", "HTML", "CSS", "SCSS", "Go",
              "Objective C", "Objective C++", "Perl", "Ruby", "Lua",
              "Groovy", "Gradle", "Protocol Buffers", "SQL"
          }

          def fresh():
              return dict(code=0, comment=0, blank=0, files=0)

          def add(out, key, item):
              row = out.setdefault(key, fresh())
              for k in ("code", "comment", "blank"):
                  row[k] += int(item[k])
              row["files"] += 1

          modules, languages, core, generated = {}, {}, {}, {}
          all_source = fresh()
          rows = []
          for path, item in raw.items():
              if not isinstance(item, dict) or not {"language", "code", "comment", "blank"} <= item.keys():
                  continue
              path = path.removeprefix("./")
              if item["language"] not in source_languages:
                  continue
              parts = path.split("/")
              module = parts[0] if len(parts) > 1 else "(root)"
              is_generated = (
                  path.endswith((".freezed.dart", ".g.dart", "_capnp.rs"))
                  or "generated_plugin_registrant" in path.lower()
                  or "/generated/" in path.lower()
              )
              add(modules, module, item)
              add(languages, item["language"], item)
              if module == "veilid-core":
                  subsystem = (
                      parts[2] if len(parts) > 2 and parts[1] == "src"
                      else parts[1] if len(parts) > 1 else "(root)"
                  )
                  add(core, subsystem, item)
              if is_generated:
                  add(generated, module, item)
              for key in ("code", "comment", "blank"):
                  all_source[key] += int(item[key])
              all_source["files"] += 1

          def sorted_rows(mapping):
              return [{"name": name, **vals}
                      for name, vals in sorted(mapping.items(), key=lambda pair: -pair[1]["code"])]

          report = {
              "revision": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "scope": "Recognized source-language files; excludes JSON/YAML/TOML/XML and other data/config.",
              "total": all_source,
              "modules": sorted_rows(modules),
              "languages": sorted_rows(languages),
              "core_submodules": sorted_rows(core),
              "known_generated": sorted_rows(generated),
              "all_cloc_recognized": raw.get("SUM", {})
          }
          print("VEILID_LOC_REPORT=" + json.dumps(report, separators=(",", ":")))
          PY
