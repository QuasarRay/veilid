name: Mirror Veilid from GitLab

on:
  # GitHub Actions' shortest supported schedule; execution may be delayed.
  schedule:
    - cron: "*/5 * * * *"
  # Trigger initial synchronization when this controller is committed.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mirror.yml"
      - "scripts/mirror.py"
      - "scripts/mirror.sh"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veilid-upstream-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout mirror controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install git-filter-repo for regression tests
        if: github.event_name != 'schedule'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-filter-repo
      - name: Test Git mirroring behavior
        if: github.event_name != 'schedule'
        run: python3 -m unittest discover -s tests -v
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Synchronize refs using Dagger
        uses: dagger/dagger-for-github@v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.21.11
          verb: run
          args: uv run --no-project --with dagger-io==0.21.11 python scripts/mirror.py
