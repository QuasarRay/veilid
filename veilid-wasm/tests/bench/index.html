<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veilid WASM WebTransport Test Bench (staging)</title>
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 1.5rem; background: #0b0f14; color: #d6e2f0; }
    h1 { font-size: 1.2rem; }
    .grid { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; max-width: 760px; }
    .k { color: #8aa0b6; }
    .v { font-weight: bold; }
    .ok { color: #6ee7a8; }
    .bad { color: #ff8a8a; }
    .pending { color: #ffd479; }
    #log { margin-top: 1rem; max-width: 1100px; height: 40vh; overflow: auto; background: #0f1620; border: 1px solid #1e2a38; padding: .5rem; white-space: pre-wrap; font-size: 12px; line-height: 1.35; }
  </style>
</head>

<body>
  <h1>Veilid in the browser, over WebTransport → staging</h1>
  <div class="grid">
    <div class="k">Secure context</div><div class="v" id="secure">—</div>
    <div class="k">window.WebTransport</div><div class="v" id="wtapi">—</div>
    <div class="k">WebTransport feature compiled</div><div class="v" id="feature">—</div>
    <div class="k">Transport policy</div><div class="v" id="policy">WebTransport only (WebSocket disabled)</div>
    <div class="k">Bootstrap</div><div class="v" id="bootstrap">—</div>
    <div class="k">Bootstrapped over WebTransport</div><div class="v" id="booted">—</div>
    <div class="k">Attachment</div><div class="v" id="attach">—</div>
    <div class="k">Public internet ready</div><div class="v" id="public">—</div>
    <div class="k">Relay (over WebTransport)</div><div class="v" id="relay">—</div>
  </div>
  <div id="log"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
