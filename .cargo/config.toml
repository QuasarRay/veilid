[build]
rustflags = ["--cfg", "tokio_unstable"]

[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
# The web-sys WebTransport bindings are gated behind this cfg. Target rustflags replace
# the `[build]` ones rather than adding to them, so anything wasm needs is repeated here.
rustflags = ["--cfg=web_sys_unstable_apis"]
